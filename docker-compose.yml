version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: bootcamp_user
      POSTGRES_PASSWORD: Tony2011
      POSTGRES_DB: ai_bootcamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://bootcamp_user:Tony2011@db:5432/ai_bootcamp

volumes:
  postgres_data:

